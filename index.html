<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183e34" />
    <meta name="description" content="Revivez votre course entre amis. Comparez vos traces GPS, vos écarts et vos ravitos, sans compte." />
    <title>RaceReplay — La course, autrement.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try { var t = localStorage.getItem('racereplay-theme'); document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
